<!doctype html>
<html lang="__LANG__" dir="__DIR__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SZR Autostrad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0f16'/%3E%3Cpath d='M18 52 L28 12 H36 L46 52 Z' fill='%23253041'/%3E%3Crect x='30.5' y='16' width='3' height='10' rx='1.5' fill='%23f5b83d'/%3E%3Crect x='30.5' y='34' width='3' height='12' rx='1.5' fill='%23f5b83d'/%3E%3C/svg%3E">
<meta name="description" content="3D driving games in the browser, set on real roads in Arab cities.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Lalezar&display=swap">
<style>
/* Layout: one column, a title, then a card per city, side by side, that stack on phones. */
:root {
  --bg: #efe7d8; --ink: #22190f; --muted: #6c5f4f; --card: #fbf7ef; --line: #ddd0b8;
  --display: 'Lalezar', 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --body: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17140f; --ink: #f3ebdc; --muted: #b3a690; --card: #221e17; --line: #3a3226; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding: max(48px, calc(env(safe-area-inset-top, 0px) + 12px)) max(20px, env(safe-area-inset-right, 0px)) max(40px, calc(env(safe-area-inset-bottom, 0px) + 24px)) max(20px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 36px; }
header { display: flex; flex-direction: column; gap: 8px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.langbtn { position: relative; font: 600 14px var(--body); color: var(--ink); background: transparent; border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.langbtn::after { content: ''; position: absolute; inset: -6px -4px; }
.langbtn:focus-visible { outline: 3px solid var(--muted); outline-offset: 2px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .1em; color: var(--muted); }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(48px, 9vw, 92px); line-height: 1; margin: 0; text-wrap: balance; }
header p { margin: 0; max-width: 60ch; color: var(--muted); font-size: 17px; }
.cities { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.city { background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; color: inherit; text-decoration: none; transition: transform .15s; }
.city:hover { transform: translateY(-3px); }
.city:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }
.city img { display: block; width: 100%; aspect-ratio: 1280 / 760; object-fit: cover; }
.city .txt { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.city h2 { font-family: var(--display); font-weight: 400; font-size: 44px; line-height: 1; margin: 0; color: var(--c); }
.city .en { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); }
.city p { margin: 0; color: var(--muted); }
.city .ver { font-size: 12px; color: var(--muted); direction: ltr; unicode-bidi: isolate; }
.play { margin-top: 10px; align-self: flex-start; background: var(--c); color: var(--card); font-family: var(--display); font-size: 24px; padding: 8px 22px 4px; border-radius: 12px; }
/* each city's color comes from its city.js */
__CARD_COLORS__
@media (prefers-color-scheme: dark) { __CARD_COLORS_DARK__ }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; border-top: 1px solid var(--line); padding-top: 28px; }
.how h3 { margin: 0 0 4px; font-size: 16px; }
.how p { margin: 0; color: var(--muted); font-size: 15px; }
kbd { font: 600 12px var(--body); background: var(--card); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; direction: ltr; display: inline-block; }
footer { font-size: 13px; color: var(--muted); }
footer a { color: inherit; }
.introShort, .app .web, .app footer a { display: none; }
/* phones: a short intro and the cities as slim rows, so every Play button fits on the first screen */
@media (max-width: 560px) {
  .wrap { padding-top: max(24px, calc(env(safe-area-inset-top, 0px) + 12px)); gap: 22px; }
  h1 { font-size: 30px; }
  .intro { display: none; }
  .introShort { display: block; font-size: 15px; }
  .cities { grid-template-columns: 1fr; gap: 8px; }
  .city { flex-direction: row; }
  .city img { width: 104px; aspect-ratio: auto; flex: none; }
  .city .txt { padding: 8px 12px; gap: 0; }
  .city .en { font-size: 11px; }
  .city h2 { font-size: 28px; }
  .city p, .city .ver { display: none; }
  .play { margin-top: 6px; font-size: 18px; padding: 6px 16px 3px; }
}
@media (prefers-reduced-motion: reduce) { .city { transition: none; } .city:hover { transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><span class="eyebrow">SZR AUTOSTRAD</span><button class="langbtn" type="button" data-lang-switch></button></div>
    <h1 data-t="h1">__L_h1__</h1>
    <p class="intro"><span data-t="intro">__L_intro__</span> <span class="web" data-t="introWeb">__L_introWeb__</span></p>
    <p class="introShort" data-t="introShort">__L_introShort__</p>
  </header>
  <section class="cities">
__CARDS__
  </section>
  <section class="how">
    <div><h3 data-t="how1t">__L_how1t__</h3><p data-t="how1">__L_how1__</p></div>
    <div><h3 data-t="how2t">__L_how2t__</h3><p data-t="how2">__L_how2__</p></div>
    <div><h3 data-t="how3t">__L_how3t__</h3><p data-t="how3">__L_how3__</p></div>
    <div><h3 data-t="how4t">__L_how4t__</h3><p data-t="how4">__L_how4__</p></div>
  </section>
  <footer><span data-t="footer">__L_footer__</span> <a href="https://github.com/njarrar/SZR-Autostrad" data-t="code">__L_code__</a></footer>
</div>
<script>
__LANGS__
// Same choice as the games: ?lang=, then the saved language, then the browser language.
(function () {
  var KEY = 'szr:lang', l = null;
  try { l = new URLSearchParams(location.search).get('lang'); } catch (e) {}
  if (!LANGS[l]) { try { l = localStorage.getItem(KEY); } catch (e) { l = null; } }
  if (!LANGS[l]) l = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
  if (!LANGS[l]) l = Object.keys(LANGS)[0];
  function apply() {
    var L = LANGS[l], codes = Object.keys(LANGS), next = codes[(codes.indexOf(l) + 1) % codes.length];
    document.documentElement.lang = l; document.documentElement.dir = L.dir;
    document.querySelectorAll('[data-t]').forEach(function (el) { el.innerHTML = L.s[el.dataset.t]; });
    document.querySelectorAll('[data-t-alt]').forEach(function (el) { el.alt = L.s[el.dataset.tAlt]; });
    document.querySelectorAll('a[data-game]').forEach(function (a) { a.href = a.getAttribute('href').split('?')[0] + '?lang=' + l; });
    var b = document.querySelector('[data-lang-switch]'); b.textContent = LANGS[next].name; b.lang = next;
    b.onclick = function () { l = next; try { localStorage.setItem(KEY, l); } catch (e) {} apply(); };
  }
  apply();
  // inside the phone apps: no talk of browsers, and on iPhone the clock and battery show
  if (window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform()) document.documentElement.classList.add('app');
  try { window.webkit.messageHandlers.statusBar.postMessage(true); } catch (e) {}
})();
</script>
</body>
</html>
