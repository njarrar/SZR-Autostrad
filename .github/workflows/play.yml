name: Play Store

# Builds the Android app for Google Play. Run it from Actions > Play Store > Run workflow,
# or push a tag such as v2.20. With the four UPLOAD_* secrets set (see "Store release" in README.md)
# the bundle is signed with your upload key; without them it is built unsigned.
# The .aab and .apk appear under Artifacts on the run page.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Build the games into the app
        working-directory: mobile
        run: |
          npm ci
          node prepare.mjs
          npx cap sync android
      - name: Write the upload key
        id: key
        env:
          KS: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        working-directory: android
        run: |
          if [ -z "$KS" ] || [ -z "$KS_PASS" ] || [ -z "$ALIAS" ]; then
            echo "signed=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$KS" | base64 -d > upload.jks
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$ALIAS" "${KEY_PASS:-$KS_PASS}" > keystore.properties
          echo "signed=yes" >> "$GITHUB_OUTPUT"
      - name: Build the bundle and APK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Remove the upload key
        if: always()
        working-directory: android
        run: rm -f upload.jks keystore.properties
      - name: Name the files after the version
        id: ver
        run: |
          v=$(grep -o "const VERSION = '[^']*'" build.mjs | cut -d"'" -f2)
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/Autostrad-$v.aab"
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$apk" "out/Autostrad-$v.apk"
          echo "v=$v" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.key.outputs.signed }}" = yes ]; then
            echo "### Autostrad $v is signed and ready for Google Play" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Autostrad $v is NOT signed. Add the four UPLOAD_* secrets and run again." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Download it under **Artifacts** below." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: Autostrad-Android-${{ steps.ver.outputs.v }}
          path: out/
