name: Build and sign the Android app

# Run it from the Actions tab (Run workflow), or push a tag such as v2.20.
# It needs four repository secrets, made once from your upload key:
#   ANDROID_KEYSTORE_BASE64   the .jks file as base64 text (base64 -i autostrad-upload.jks)
#   ANDROID_KEYSTORE_PASSWORD the key store password
#   ANDROID_KEY_ALIAS         the key alias, for example upload
#   ANDROID_KEY_PASSWORD      the key password
# The signed Play bundle (.aab) and APK appear under Artifacts on the run page.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check the signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for v in KS KS_PASS ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then echo "::error::A signing secret is missing. See the top of .github/workflows/android.yml."; exit 1; fi
          done
      - name: Build the games into the app
        working-directory: mobile
        run: |
          npm ci
          node prepare.mjs
          npx cap sync android
      - name: Write the upload key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KS" | base64 -d > upload.jks
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$ALIAS" "$KEY_PASS" > keystore.properties
      - name: Build the signed bundle and APK
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Remove the upload key
        if: always()
        working-directory: android
        run: rm -f upload.jks keystore.properties
      - name: Name the files after the version
        id: ver
        run: |
          v=$(grep -o "const VERSION = '[^']*'" build.mjs | cut -d"'" -f2)
          mkdir out
          cp android/app/build/outputs/bundle/release/app-release.aab "out/autostrad-$v.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "out/autostrad-$v.apk"
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: autostrad-android-${{ steps.ver.outputs.v }}
          path: out/
